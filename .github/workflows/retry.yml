name: retry-once

# A failed scheduled run is usually transient (a data source timing out, a runner
# hiccup). Wait five minutes and re-run the failed jobs once. A second failure is
# left as a failure, so GitHub's failure e-mail and the daily health check see it.
on:
  workflow_run:
    workflows: ["pipeline"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: sleep 300
      - run: gh run rerun ${{ github.event.workflow_run.id }} --failed --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
